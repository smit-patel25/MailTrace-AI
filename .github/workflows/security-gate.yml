name: Security Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Pytest
      run: |
        python -m pytest -q

    - name: Run Ruff
      run: |
        python -m ruff check .

    - name: Run Bandit
      run: |
        python -m bandit -r app.py modules pages -ll -ii

    - name: Run pip-audit
      run: |
        python -m pip_audit -r requirements.txt

    - name: Run pip check
      run: |
        python -m pip check
