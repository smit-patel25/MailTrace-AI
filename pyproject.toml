[tool.ruff]
exclude = [
    ".venv",
    "__pycache__",
    "local_test_samples",
    "data",
    "build",
    "dist",
    ".pytest_cache",
    ".streamlit"
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E701", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F841", "E721", "F401"]
